assets:
  - code: USD
    scale: 2
    liquidity: 10000000
    liquidityThreshold: 10000000
  - code: EUR
    scale: 2
    liquidity: 10000000
    liquidityThreshold: 10000000
# Peer in USD at scale 9, so small payments (daily coupons) aren't lost to rounding at the USD hop between nodes
  - code: USD
    scale: 9
    liquidity: 1000000000000000000
    liquidityThreshold: 1000000000000
peeringAsset: 'USD:9'
peers:
  # Address and routes for this peer MUST remain unchanged when NOT in multihop mode so that happy-life packets aren't routed through global-bank
  - initialLiquidity: '100000000000000000'
    peerUrl: http://global-bank-backend:3002
    peerIlpAddress: test.unreachable.global-bank
    liquidityThreshold: 1000000
    tokens:
      incoming:
        - global-to-cloud-nine
      outgoing: cloud-nine-to-global
    routes: 
      - "test.unreachable.global-bank" 
  - initialLiquidity: '100000000000000000'
    peerUrl: http://happy-life-bank-backend:3002
    peerIlpAddress: test.happy-life-bank
    liquidityThreshold: 1000000
    tokens:
      incoming:
        - happy-to-cloud-nine
      outgoing: cloud-nine-to-happy
    routes: 
      - "test.happy-life-bank"
  - initialLiquidity: '100000000000000000'
    peerUrl: http://cape-town-node-backend:3002
    peerIlpAddress: test.cape-town-node
    liquidityThreshold: 1000000
    tokens:
      incoming:
        - cape-town-to-cloud-nine
      outgoing: cloud-nine-to-cape-town
    routes:
      - "test.cape-town-node"
