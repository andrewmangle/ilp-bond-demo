assets:
  - code: USD
    scale: 2
    liquidity: 2000000000000
    liquidityThreshold: 10000000
  - code: EUR
    scale: 2
    liquidity: 100000000
    liquidityThreshold: 10000000
  - code: MXN
    scale: 2
    liquidity: 100000000
    liquidityThreshold: 10000000
  - code: JPY
    scale: 0
    liquidity: 1000000
    liquidityThreshold: 100000
# Peer in USD at scale 9, so small payments (daily coupons) aren't lost to rounding at the USD hop between nodes
  - code: USD
    scale: 9
    liquidity: 1000000000000000000
    liquidityThreshold: 1000000000000
peeringAsset: 'USD:9'
peers:
  - initialLiquidity: '100000000000000000'
    peerUrl: http://cloud-nine-wallet-backend:3002
    peerIlpAddress: test.cloud-nine-wallet
    liquidityThreshold: 1000000
    maxPacketAmount: 100000000000 # 100 USD at the peering asset's scale 9
    tokens:
      incoming:
        - cloud-nine-to-happy
      outgoing: happy-to-cloud-nine
    routes:
      - "test.cloud-nine-wallet"
  - initialLiquidity: '100000000000000000'
    peerUrl: http://cloud-nine-wallet-backend:3002
    peerIlpAddress: test.cloud-nine-wallet.bc293b79-8609-47bd-b914-6438b470aff8
    liquidityThreshold: 1000000
    maxPacketAmount: 100000000000 # 100 USD at the peering asset's scale 9
    tokens:
      incoming:
        - cloud-ten-to-happy
      outgoing: happy-to-cloud-ten
    routes:
      - "test.cloud-nine-wallet.bc293b79-8609-47bd-b914-6438b470aff8"
  # Address and routes for this peer MUST remain unchanged when NOT in multihop mode so that cloud-nine/cloud-ten packets aren't routed through global-bank
  - initialLiquidity: '100000000000000000'
    peerUrl: http://global-bank-backend:3002
    peerIlpAddress: test.unreachable.global-bank
    liquidityThreshold: 1000000
    tokens:
      incoming:
        - global-to-happy
      outgoing: happy-to-global
    routes: 
      - "test.unreachable.global-bank"
  - initialLiquidity: '100000000000000000'
    peerUrl: http://cape-town-node-backend:3002
    peerIlpAddress: test.cape-town-node
    liquidityThreshold: 1000000
    tokens:
      incoming:
        - cape-town-to-happy
      outgoing: happy-to-cape-town
    routes:
      - "test.cape-town-node"
